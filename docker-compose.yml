# Dev docker-compose — bind mounts source for hot reload, no resource caps.
# For production: use docker-compose.prod.yml

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        GIT_SHA: dev
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./ui:/app/ui
      - ./evals:/app/evals
    command: ["app"]
    environment:
      UVICORN_WORKERS: "1"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: ["worker"]

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./app:/app/app
    command: ["beat"]

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    env_file:
      - .env
    environment:
      CHATBOT_API_BASE: "http://app:8000"
    ports:
      - "8501:8501"
    depends_on:
      - app
    volumes:
      - ./ui:/app/ui
      - ./app:/app/app
    command: ["ui"]

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data

volumes:
  postgres_data:
  redis_data:
  metabase_data:
