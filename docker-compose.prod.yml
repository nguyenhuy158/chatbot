# Production docker-compose.
#
# Differences from docker-compose.yml (dev):
#   - No bind mounts of source code (image is the source of truth)
#   - Resource limits set
#   - read_only filesystem where possible
#   - Explicit restart policies
#   - Health-gated service start order
#   - Uses pre-built images from registry (override IMAGE_TAG env)
#
# Run:
#   IMAGE_TAG=v0.1.0 docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/your-org}/chatbot:${IMAGE_TAG:-latest}
    env_file: [.env]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ${IMAGE_REGISTRY:-ghcr.io/your-org}/chatbot:${IMAGE_TAG:-latest}
    env_file: [.env]
    command: ["app"]
    environment:
      UVICORN_WORKERS: "4"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    read_only: false  # FastAPI writes to /tmp uploads; could lock down with tmpfs

  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/your-org}/chatbot:${IMAGE_TAG:-latest}
    env_file: [.env]
    command: ["worker"]
    environment:
      CELERY_CONCURRENCY: "4"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.0"

  beat:
    image: ${IMAGE_REGISTRY:-ghcr.io/your-org}/chatbot:${IMAGE_TAG:-latest}
    env_file: [.env]
    command: ["beat"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  ui:
    image: ${IMAGE_REGISTRY:-ghcr.io/your-org}/chatbot:${IMAGE_TAG:-latest}
    env_file: [.env]
    command: ["ui"]
    environment:
      CHATBOT_API_BASE: "http://app:8000"
    ports:
      - "8501:8501"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data:
