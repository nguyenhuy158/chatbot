name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.4"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"

      - name: ruff check
        run: ruff check app tests

      - name: ruff format check
        run: ruff format --check app tests

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"

      - name: mypy
        run: mypy app

  test:
    name: Smoke tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
          POSTGRES_DB: chatbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chatbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-test-secret-key-min-32-characters-long
      DATABASE_URL: postgresql+asyncpg://chatbot:chatbot@localhost:5432/chatbot
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      ANTHROPIC_API_KEY: sk-ant-ci-stub
      OPENAI_API_KEY: sk-ci-stub
      GOOGLE_API_KEY: ci-stub
      TAVILY_API_KEY: tvly-ci-stub
      GOOGLE_CLIENT_ID: ci-stub.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-stub
      MICROSOFT_CLIENT_ID: ci-stub
      MICROSOFT_CLIENT_SECRET: ci-stub

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: uv pip install --system -e ".[dev]"

      - name: Alembic migrate
        run: alembic upgrade head

      - name: Smoke tests
        run: pytest tests/test_smoke.py -v
