[project]
name = "chatbot"
version = "0.1.0"
description = "Multi-purpose AI chatbot with RAG, memory, and tools"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    # Auth
    "authlib>=1.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "itsdangerous>=2.2.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "tiktoken>=0.8.0",
    # Cache + queue
    "redis>=5.0.0",
    "celery>=5.4.0",
    # LangGraph + LLM
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    "openai>=1.50.0",
    # RAG
    "llama-index>=0.11.0",
    "llama-index-vector-stores-postgres>=0.2.0",
    "llama-index-embeddings-google-genai>=0.1.0",
    "unstructured[pdf,docx]>=0.15.0",
    "pymupdf4llm>=0.0.17",
    # Memory
    "mem0ai>=0.1.20",
    # Guardrails
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "langdetect>=1.0.9",
    # Config + validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # HTTP
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    # Observability
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "langfuse>=2.50.0",
    # Logging
    "structlog>=24.4.0",
    # Localization
    "babel>=2.16.0",
    # Admin
    "sqladmin>=0.18.0",
    # Utils
    "python-slugify>=8.0.0",
    "orjson>=3.10.0",
    "tavily-python>=0.5.0",
    "asteval>=1.0.0",
    "pyyaml>=6.0.0",
    # Channels
    "slack-bolt>=1.20.0",
    "python-telegram-bot>=21.5",
    # Email
    "aiosmtplib>=3.0.0",
    # UI
    "chainlit>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-redis",
    "fakeredis>=2.20.0",
    "tzdata>=2024.1",
]
eval = [
    "ragas>=0.2.0",
    "deepeval>=1.4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
